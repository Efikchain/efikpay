<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EfikPay</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f4f7fb;color:#122033}
    .app{max-width:480px;margin:auto;min-height:100vh;background:#fff}.hero{padding:28px 22px;color:#fff;background:linear-gradient(135deg,#071d35,#0b4b7a);border-radius:0 0 28px 28px}
    .brand{font-size:26px;font-weight:800}.muted{opacity:.78;font-size:13px}.balance{margin-top:24px;font-size:34px;font-weight:800}
    main{padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.action{border:0;background:#eef4f9;border-radius:16px;padding:13px 4px;font-weight:700;font-size:11px}
    .action b{display:block;font-size:20px;margin-bottom:5px}.card{border:1px solid #e4e9ef;border-radius:17px;padding:17px;margin-top:18px}.title{display:flex;justify-content:space-between;align-items:center}.title h2{font-size:16px;margin:0}
    .btn{border:0;background:#1266d6;color:#fff;border-radius:12px;padding:13px 16px;font-weight:800}.btn.secondary{background:#eef2f6;color:#1f2937}
    input{width:100%;padding:13px;border:1px solid #d6dde6;border-radius:11px;margin:6px 0 12px}label{font-size:12px;font-weight:800}
    .hidden{display:none}.nav{position:sticky;bottom:0;background:#fff;border-top:1px solid #e5e7eb;display:grid;grid-template-columns:repeat(4,1fr);padding:10px}
    .nav button{border:0;background:none;font-size:11px;color:#657184}.nav button.active{color:#1266d6;font-weight:800}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:480px;margin:auto;padding:22px;border-radius:24px 24px 0 0;max-height:85vh;overflow:auto}
    .bank{padding:12px 0;border-bottom:1px solid #edf0f3;font-size:13px}.ok{color:#15803d}.err{color:#b91c1c}
  </style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="brand">EfikPay</div>
    <div class="muted">Wallet • Bank transfer • POS</div>
    <div class="balance" id="balance">₦0.00</div>
    <div class="muted">Available balance</div>
  </header>

  <main>
    <div class="grid">
      <button class="action" onclick="openSend()"><b>↗</b>Send</button>
      <button class="action" onclick="openBanks()"><b>🏦</b>Banks</button>
      <button class="action" onclick="openPos()"><b>▣</b>POS</button>
      <button class="action" onclick="loadHistory()"><b>↻</b>History</button>
    </div>

    <div class="card">
      <div class="title"><h2>EfikPay status</h2><span class="ok">● Online</span></div>
      <p class="muted" style="margin-bottom:0">Secure API connection is active.</p>
    </div>

    <div class="card">
      <div class="title"><h2>Quick account access</h2></div>
      <div id="authBox">
        <p class="muted">Sign in to view wallet and perform authenticated operations.</p>
        <button class="btn" onclick="openAuth()">Sign in / Register</button>
      </div>
    </div>

    <div class="card">
      <div class="title"><h2>Recent activity</h2></div>
      <div id="history" class="muted">Sign in to view transactions.</div>
    </div>
  </main>

  <nav class="nav">
    <button class="active">⌂<br>Home</button>
    <button onclick="openSend()">↗<br>Transfer</button>
    <button onclick="openBanks()">🏦<br>Banks</button>
    <button onclick="loadHistory()">≡<br>History</button>
  </nav>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="title">
      <h2 id="modalTitle">EfikPay</h2>
      <button class="btn secondary" onclick="closeModal()">Close</button>
    </div>
    <div id="modalBody" style="margin-top:18px"></div>
  </div>
</div>

<script>
const API = "/api";
let token = localStorage.getItem("efikpay_token");

function money(v){return new Intl.NumberFormat("en-NG",{style:"currency",currency:"NGN"}).format(Number(v)||0)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function openModal(title, body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}

async function api(path, options={}){
  options.headers={...(options.headers||{}),...(token?{Authorization:`Bearer ${token}`}:{})};
  const r=await fetch(API+path,options);
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.message||"Request failed");
  return d;
}

function openAuth(){
  openModal("EfikPay account",`
    <label>Email</label><input id="email" type="email">
    <label>Password</label><input id="password" type="password">
    <label>Full name (for registration)</label><input id="full_name">
    <label>Phone (optional)</label><input id="phone">
    <button class="btn" onclick="register()">Register</button>
    <button class="btn secondary" onclick="login()">Sign in</button>
    <p id="authMsg"></p>
  `);
}

async function register(){
  try{
    const d=await api("/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      email:email.value,password:password.value,full_name:full_name.value,phone:phone.value||undefined
    })});
    token=d.token;localStorage.setItem("efikpay_token",token);closeModal();loadWallet();
  }catch(e){authMsg.className="err";authMsg.textContent=e.message}
}

async function login(){
  try{
    const d=await api("/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      email:email.value,password:password.value
    })});
    token=d.token;localStorage.setItem("efikpay_token",token);closeModal();loadWallet();
  }catch(e){authMsg.className="err";authMsg.textContent=e.message}
}

async function loadWallet(){
  if(!token)return;
  try{
    const d=await api("/wallet");
    balance.textContent=money(d.wallet.balance);
    document.getElementById("authBox").innerHTML="<span class='ok'>Signed in</span>";
  }catch(e){localStorage.removeItem("efikpay_token");token=null}
}

async function openBanks(){
  openModal("Supported banks","Loading banks...");
  try{
    const d=await api("/banks");
    modalBody.innerHTML=d.banks.map(b=>`<div class="bank"><b>${esc(b.name)}</b><br><span class="muted">Code: ${esc(b.code)}</span></div>`).join("");
  }catch(e){modalBody.innerHTML=`<p class="err">${esc(e.message)}</p>`}
}

function openSend(){
  if(!token){openAuth();return}
  openModal("Bank transfer",`
    <label>Bank code</label><input id="bank" placeholder="e.g. 044">
    <label>Account number</label><input id="account" inputmode="numeric" maxlength="10">
    <label>Amount (NGN)</label><input id="amount" type="number" min="1">
    <label>Narration</label><input id="narration" maxlength="100">
    <button class="btn" onclick="sendMoney()">Send money</button>
    <p id="sendMsg"></p>
  `);
}

async function sendMoney(){
  try{
    const d=await api("/transfers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      account_bank:bank.value,account_number:account.value,amount:Number(amount.value),narration:narration.value||undefined
    })});
    sendMsg.className="ok";sendMsg.textContent=`Transfer submitted: ${d.transfer.reference}`;
    loadWallet();
  }catch(e){sendMsg.className="err";sendMsg.textContent=e.message}
}

function openPos(){
  if(!token){openAuth();return}
  openModal("EfikPay POS",`
    <label>Sale amount (NGN)</label><input id="posAmount" type="number" min="1">
    <label>Description</label><input id="posDesc" maxlength="200">
    <button class="btn" onclick="createSale()">Create POS sale</button>
    <p id="posMsg"></p>
  `);
}

async function createSale(){
  try{
    const d=await api("/pos/sales",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      amount:Number(posAmount.value),description:posDesc.value||undefined
    })});
    posMsg.className="ok";posMsg.textContent=`POS sale created: ${d.sale.reference}`;
  }catch(e){posMsg.className="err";posMsg.textContent=e.message}
}

async function loadHistory(){
  if(!token){openAuth();return}
  openModal("Transaction history","Loading...");
  try{
    const d=await api("/wallet/history");
    modalBody.innerHTML=d.transactions.length?d.transactions.map(x=>`
      <div class="bank">
        <b>${esc(x.description)}</b><br>
        ${esc(x.type)} · ${esc(x.status)} · ${money(x.amount)}<br>
        <span class="muted">${new Date(x.created_at).toLocaleString()}</span>
      </div>`).join(""):"<p class='muted'>No transactions yet.</p>";
  }catch(e){modalBody.innerHTML=`<p class="err">${esc(e.message)}</p>`}
}

loadWallet();
</script>
</body>
</html>
